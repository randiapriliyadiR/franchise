name: Sync TMDB data

on:
  workflow_dispatch: {}
  schedule:
    # First of every month, 03:17 UTC — franchise release dates don't
    # exactly change often, this just keeps ratings/synopses fresh.
    - cron: '17 3 1 * *'

permissions:
  contents: write

concurrency:
  group: sync-tmdb
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TMDB sync
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: npm run sync:tmdb

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/lib/data/generated; then
            echo "No data changes."
            exit 0
          fi
          git add src/lib/data/generated
          git commit -m "chore(data): refresh tmdb metadata"
          git push
